[package]
name = "vesta-gpui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Backend-neutral declarative UI, layout, text and input contracts for GPUI hosts"

[dependencies]
bytemuck.workspace = true
serde_json.workspace = true
taffy.workspace = true
parley = { version = "=0.7.0", default-features = false, features = ["std", "accesskit"] }
accesskit = "=0.21.1"
unicode-segmentation = "=1.13.3"
swash = { version = "=0.2.10", default-features = false, features = ["std", "render"] }

[dev-dependencies]
accesskit_consumer = "=0.31.0"

[lints]
workspace = true
