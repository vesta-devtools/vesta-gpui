[package]
name = "vesta-gpui-winit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "winit input and IME adapter for vesta-gpui"

[dependencies]
accesskit_winit = "=0.29.2"
vesta-gpui.workspace = true
winit = { workspace = true, features = ["serde"] }
serde_json.workspace = true
url = "=2.5.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
open = "=5.4.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Graphics_Gdi"] }

# Only the read-only monitor query admits documented Win32 calls.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
