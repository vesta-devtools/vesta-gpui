name: Source and Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: 1.89.0
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Source and tool contracts
        shell: pwsh
        run: |
          node --test tools/sdk/gpui_source.test.mjs tools/verify/gpui_profile.test.mjs tools/verify/architecture.test.mjs tools/verify/ui_workloads.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/sdk/gpui_source.mjs --verify .
          exit $LASTEXITCODE
      - name: Pinned toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt
      - name: Resolved architecture boundaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/architecture | Out-Null
          cargo metadata --locked --format-version 1 --all-features | Set-Content -Encoding utf8 target/architecture/metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/verify/architecture.mjs target/architecture/metadata.json
          exit $LASTEXITCODE
      - name: Format
        run: cargo fmt --all -- --check
      - name: All feature contracts and examples
        run: cargo test --locked --workspace --all-targets --all-features -j 2
      - name: Documentation contracts
        run: cargo test --locked --workspace --doc --all-features -j 2
      - name: Strict all feature checks
        run: cargo clippy --locked --workspace --all-targets --all-features -j 2 -- -D warnings
      - name: Strict renderer base feature checks
        run: cargo clippy --locked -p vesta-gpui-vulkan --all-targets --no-default-features -j 2 -- -D warnings
